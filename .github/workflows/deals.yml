# GWI Golf Deals — re-checks every deal's price and stock each morning.
# File location in the repository: .github/workflows/deals.yml
name: Check golf deals

on:
  schedule:
    - cron: '37 11 * * *'     # daily ~6:37 AM Central
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gwi-deals
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check deals
        run: node build-deals.mjs
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Golf deals check $(date -u +%F)"
          git pull --rebase --autostash
          git push
