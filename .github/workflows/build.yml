# GWI LIVE Betting — rebuilds market + score data every 10 minutes and publishes it with GitHub Pages.
# Also publishes data/events.json (DFW Events) alongside it.
name: Build GWI market data

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gwi-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build markets.json and scores.json
        run: node build-data.mjs out
        env:
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Include DFW events (made by the daily events job)
        run: |
          mkdir -p out
          if [ -f data/events.json ]; then cp data/events.json out/events.json; fi
          if [ -f data/deals.json ]; then cp data/deals.json out/deals.json; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
