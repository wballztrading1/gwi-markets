name: TEST kalshi discovery (temporary)
on:
  push:
    branches: [test-kalshi-discovery]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node build-data.mjs out
      - run: |
          node -e '
          const m=require("./out/markets.json");
          console.log(JSON.stringify(m.sources.map(s=>[s.source,s.count,s.message])));
          const k=m.markets.filter(x=>x.source=="kalshi");
          const c={};for(const x of k)c[x.eventTitle]=(c[x.eventTitle]||0)+1;
          console.log("KALSHI BOARDS ON PAGE:",JSON.stringify(c,null,1));
          console.log("TOTAL ON PAGE:",m.markets.length, m.note);'
